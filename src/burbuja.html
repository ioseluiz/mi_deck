<!-- La cara de la burbuja. Diminuta a proposito. -->
<meta charset="utf-8" />
<title>MiDeck</title>
<link rel="stylesheet" href="styles.css" />
<style>
  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    /* Nada de aqui es texto que se seleccione ni se arrastre. */
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }

  #burbuja {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    border: none;
    border-radius: 50%;
    background: var(--tecla);
    color: var(--texto);
    box-shadow: 0 2px 10px rgb(0 0 0 / 45%);
    /* En reposo translucida para no cantar, pero no tanto como para que el
       icono deje de leerse: el contraste medido vale a partir de aqui. */
    opacity: 0.82;
    transition: opacity 120ms ease, transform 120ms ease;
    padding: 0;
  }

  #burbuja:hover {
    opacity: 1;
    transform: scale(1.06);
  }

  #burbuja:active {
    transform: scale(0.94);
  }

  #burbuja svg {
    width: 26px;
    height: 26px;
  }
</style>

<button id="burbuja" type="button" title="MiDeck">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="3" y="4" width="7" height="7" rx="1.5" />
    <rect x="14" y="4" width="7" height="7" rx="1.5" />
    <rect x="3" y="13" width="7" height="7" rx="1.5" />
    <rect x="14" y="13" width="7" height="7" rx="1.5" />
  </svg>
</button>

<script type="module" src="burbuja.js"></script>
